<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Monochromatic Architectural Squircle -->
  <rect width="48" height="48" rx="12" fill="#09090B"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="rgba(255, 255, 255, 0.12)"/>
  
  <!-- Subtle Internal Radial Depth -->
  <circle cx="24" cy="20" r="18" fill="white" fill-opacity="0.03"/>

  <!-- Android Robot Head Monogram -->
  <path d="M16 19C16 14.5817 19.5817 11 24 11C28.4183 11 32 14.5817 32 19V20H16V19Z" fill="#FAFAFA"/>
  
  <!-- Antennae -->
  <line x1="18.5" y1="12" x2="16.5" y2="8.5" stroke="#FAFAFA" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="29.5" y1="12" x2="31.5" y2="8.5" stroke="#FAFAFA" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Eyes -->
  <circle cx="20" cy="16.5" r="1.25" fill="#09090B"/>
  <circle cx="28" cy="16.5" r="1.25" fill="#09090B"/>

  <!-- Superuser Root Hash (#) Glyph in Base Badge -->
  <!-- Horizontal bars -->
  <line x1="16.5" y1="26.5" x2="31.5" y2="26.5" stroke="#FAFAFA" stroke-width="2" stroke-linecap="round"/>
  <line x1="15.5" y1="32.5" x2="30.5" y2="32.5" stroke="#FAFAFA" stroke-width="2" stroke-linecap="round"/>
  <!-- Vertical slanted bars -->
  <line x1="20.5" y1="23.5" x2="18.5" y2="35.5" stroke="#FAFAFA" stroke-width="2" stroke-linecap="round"/>
  <line x1="28.5" y1="23.5" x2="26.5" y2="35.5" stroke="#FAFAFA" stroke-width="2" stroke-linecap="round"/>

  <!-- Subtle Emerald Status Micro-Pip (Only Functional Dot) -->
  <circle cx="34" cy="33" r="2" fill="#10B981"/>
</svg>
